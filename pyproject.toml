[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wilds-solving"
version = "0.1.0"
description = "WILDS plate-solving — source extraction and astrometric solution"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0",
    "sep>=1.4",
    "astrometry>=4.3",
    "astropy>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/wilds"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade (enforces modern Python idioms incl. PEP 585/604)
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # line too long — formatter handles this
]

[tool.ruff.lint.isort]
known-first-party = ["wilds"]
